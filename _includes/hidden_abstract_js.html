<script type='text/javascript'>
function show_abs(id){
    document.getElementById("abs-"+id).style.display="block"
    document.getElementById("habs-"+id).style.display="none"
}
function hide_abs(id){
    document.getElementById("abs-"+id).style.display="none"
    document.getElementById("habs-"+id).style.display="block"
}
</script>
